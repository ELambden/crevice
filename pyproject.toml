[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crevice"
# Single source of truth: `__version__` in src/crevice/__init__.py (see
# [tool.hatch.version] below and CONTRIBUTING.md "Versioning").
dynamic = ["version"]
description = "CREVICE: Cavity and Residue Environment Visualisation, Interaction and Connectivity Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Edward Lambden", email = "edward.lambden@kcl.ac.uk" }
]
keywords = [
  "molecular-dynamics",
  "membrane-proteins",
  "ion-channels",
  "cavities",
  "tunnels",
  "structural-biology"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
# Required runtime libraries: NumPy, SciPy, MDAnalysis and Matplotlib.
# scikit-image is also required: its
# skimage.measure.marching_cubes is the only scikit-image call, and default
# `crevice cast` and `crevice publish` runs reach it unconditionally through the
# viewer cast mesh (volume_export), the boundary-residue surface attribution
# (residue_evidence) and the hydration viewer meshes (analysis_viewers); `cast`
# also uses it for the cast preview figure. Lower bounds
# are the oldest mutually compatible releases exercised by the minimum-versions
# check (.github/constraints/minimum.txt). Keep this list in sync with that file
# and CONTRIBUTING.md (tests/test_packaging.py enforces it).
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "MDAnalysis>=2.7",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
# Optional extras list only libraries that are NOT already required above.
# Validated entity-aware mmCIF intake (falls back to the builtin parser).
structures = ["gemmi>=0.7,<0.8"]
# Residue-network graph utilities in crevice.connectivity.
networks = ["networkx>=3.2"]
# Hydration extensions: MDTraj DSSP secondary-structure context (reported as
# explicitly unavailable without it).
hydration = ["mdtraj>=1.10"]
# scikit-learn PCA in crevice.ml.reduce_dimensions.
ml = ["scikit-learn>=1.3"]
# Every optional scientific library used somewhere in CREVICE.
science = [
  "gemmi>=0.7,<0.8",
  "networkx>=3.2",
  "mdtraj>=1.10",
  "scikit-learn>=1.3",
]
# What the regression suite needs beyond the required libraries.
test = [
  "pytest>=7.0",
  "tomli>=1.1; python_version < '3.11'",
  "gemmi>=0.7,<0.8",
  "networkx>=3.2",
  "mdtraj>=1.10",
]

[project.urls]
Homepage = "https://github.com/ELambden/crevice"
Source = "https://github.com/ELambden/crevice"
Documentation = "https://github.com/ELambden/crevice/tree/main/docs"
Issues = "https://github.com/ELambden/crevice/issues"
Changelog = "https://github.com/ELambden/crevice/blob/main/CHANGELOG.md"

[project.scripts]
crevice = "crevice.cli:main"

[tool.hatch.version]
path = "src/crevice/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crevice"]
