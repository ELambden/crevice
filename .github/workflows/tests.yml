name: Scientific and Packaging Checks

# Software checks only: passing CI is not real-system or functional validation.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  MPLBACKEND: Agg

jobs:
  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with requires-python and the classifiers in pyproject.toml.
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CREVICE with required and test dependencies
        run: python -m pip install '.[test]'
      - name: Record environment
        run: |
          mkdir -p ci-artifacts
          python -m pip freeze > ci-artifacts/pip-freeze.txt
      - name: Regression suite
        run: >-
          python -m pytest -q -rs tests
          --junitxml=ci-artifacts/pytest.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: ci-artifacts/

  minimum-versions:
    name: tests (oldest supported NumPy/SciPy/MDAnalysis/Matplotlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints/minimum.txt
      - name: Install with the declared lower bounds pinned
        run: python -m pip install -c .github/constraints/minimum.txt '.[test]'
      - name: Record environment
        run: |
          mkdir -p ci-artifacts
          python -m pip freeze > ci-artifacts/pip-freeze.txt
      - name: Regression suite
        run: >-
          python -m pytest -q -rs tests
          --junitxml=ci-artifacts/pytest.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-minimum-versions
          path: ci-artifacts/

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      # Without --sdist/--wheel, `build` makes the sdist and then builds the
      # wheel from that sdist, so this also proves the sdist is buildable.
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: List sdist contents
        run: tar -tzf dist/*.tar.gz | sort > dist/sdist-contents.txt
      - name: Install the wheel in a fresh environment and smoke-test it
        run: |
          wheel=$(ls dist/*.whl)
          test "$(echo "$wheel" | wc -l)" -eq 1
          python scripts/check_wheel.py "$wheel" --report dist/wheel-check.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distributions
          path: dist/

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docs/requirements.txt
      - name: Install CREVICE and the documentation requirements
        run: python -m pip install . -r docs/requirements.txt
      # Warnings are errors. The API pages import crevice from src/, and the
      # intersphinx inventories are fetched over the network.
      - name: Build the HTML documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      # External link checking is informational only: publisher sites often
      # refuse automated requests, so it must not block CI.
      - name: Check external links (non-blocking)
        continue-on-error: true
        run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: documentation-html
          path: |
            docs/_build/html/
            docs/_build/linkcheck/output.txt
