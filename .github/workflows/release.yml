name: Release to PyPI

# Publishing a GitHub Release whose tag is vX.Y.Z (matching __version__ in
# src/crevice/__init__.py) builds, tests and uploads that version to PyPI.
# Running the workflow manually ("Run workflow") uploads the current commit's
# build to TestPyPI instead, as a dry run. Uploads use PyPI Trusted Publishing
# (OpenID Connect), so no API token is stored in the repository; see
# docs/development/releasing.md for the one-time PyPI and TestPyPI setup.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the package with test dependencies
        run: python -m pip install ".[test]" build twine
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/crevice/__init__.py').read_text()).group(1))")
          tag_version="${TAG#v}"
          normalized=$(python -c "from packaging.version import Version; import sys; print(Version(sys.argv[1]))" "$tag_version")
          echo "tag=$TAG package=$version"
          if [ "$normalized" != "$version" ]; then
            echo "::error::Release tag $TAG does not match __version__ $version"
            exit 1
          fi
      - name: Run the test suite
        run: python -m pytest -q -rs tests
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish-pypi:
    name: Upload to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/crevice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Upload to TestPyPI (manual dry run)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/crevice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
